[project]
name = "aimpg"
version = "0.3.0"
description = "Real-world energy per solved task for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kumar Ganduri" }]
keywords = ["ai", "energy", "claude-code", "carbon", "llm", "sustainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kumarganduri/aimpg"
Issues = "https://github.com/kumarganduri/aimpg/issues"

[project.scripts]
aimpg = "aimpg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aimpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: performance tests (deselect with -m 'not slow')",
    "network: needs internet (PyPI) for replay end-to-end tests",
]
